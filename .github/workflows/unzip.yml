name: Auto Extract ZIP

on:
  push:
    paths:
      - '**.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak semua file ZIP
        run: |
          shopt -s nullglob globstar
          found=0
          for z in **/*.zip; do
            case "$z" in node_modules/*) continue;; esac
            found=1
            echo "Ekstrak: $z"
            tmp=$(mktemp -d)
            unzip -q -o "$z" -d "$tmp"
            rm -rf "$tmp/__MACOSX"
            # Kalau isi zip cuma 1 folder pembungkus, ratakan
            if [ "$(ls -A "$tmp" | wc -l)" = "1" ] && [ -d "$tmp/$(ls -A "$tmp")" ]; then
              inner="$tmp/$(ls -A "$tmp")"
              cp -a "$inner"/. .
            else
              cp -a "$tmp"/. .
            fi
            rm -rf "$tmp"
            git rm -q -f "$z"
          done
          echo "found=$found" >> "$GITHUB_ENV"

      - name: Commit hasil ekstrak
        if: env.found == '1'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: auto-extract zip"
          git push
